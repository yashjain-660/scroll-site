<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer glow & base -->
  <rect width="64" height="64" rx="16" fill="#08080a"/>
  
  <!-- Watch Case (Titanium squircle) -->
  <rect x="12" y="10" width="40" height="44" rx="11" fill="#18181c" stroke="#52525b" stroke-width="2"/>
  
  <!-- Digital Crown (Right) -->
  <rect x="52" y="22" width="4" height="10" rx="1.5" fill="#a1a1aa" stroke="#71717a" stroke-width="1"/>
  
  <!-- Action Button (Left - Anodized Orange Accent) -->
  <rect x="8" y="24" width="4" height="8" rx="1.5" fill="#f97316"/>
  
  <!-- Sapphire Display Screen -->
  <rect x="16" y="14" width="32" height="36" rx="8" fill="#000000" stroke="#27272a" stroke-width="1.5"/>
  
  <!-- Watch Hands / Minimal Dial -->
  <circle cx="32" cy="32" r="2.5" fill="#f5f5f4"/>
  <line x1="32" y1="32" x2="32" y2="20" stroke="#f5f5f4" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="40" y2="32" stroke="#f97316" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Subtle Hydro/Status Dot -->
  <circle cx="32" cy="42" r="1.5" fill="#00e5ff"/>
</svg>
